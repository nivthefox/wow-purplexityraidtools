name: Update Boss Timelines

on:
  schedule:
    - cron: '0 8 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-boss-timelines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: build
    env:
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Resolve boss-mod inputs
        run: |
          git clone --depth 1 https://github.com/BigWigsMods/BigWigs.git "${{ runner.temp }}/BigWigs"
          git clone --depth 1 https://github.com/DeadlyBossMods/DeadlyBossMods.git "${{ runner.temp }}/DeadlyBossMods"
          git -C "${{ runner.temp }}/BigWigs" rev-parse --verify HEAD
          git -C "${{ runner.temp }}/DeadlyBossMods" rev-parse --verify HEAD

      - run: npm test

      - run: luajit tests/run_tests.lua

      - name: Generate boss timelines
        run: >-
          npm run generate:boss-timelines --
          --bigwigs "${{ runner.temp }}/BigWigs"
          --dbm "${{ runner.temp }}/DeadlyBossMods"

      - name: Verify secrets are absent
        run: |
          if grep -Fq "$WCL_CLIENT_ID" BossTimelineData.lua; then exit 1; fi
          if grep -Fq "$WCL_CLIENT_SECRET" BossTimelineData.lua; then exit 1; fi

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain BossTimelineData.lua)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update review pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/update-boss-timelines"
          git checkout -B "$branch"
          git add BossTimelineData.lua
          git commit -m "chore: update boss timeline database"
          git push --force origin "$branch"
          existing="$(gh pr list --head "$branch" --json number -q '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore: update boss timeline database" \
              --body "Updates the generated boss timeline database. Review the deterministic data diff before merging." \
              --head "$branch" \
              --base main
          fi
