name: Update Spell Data

on:
  schedule:
    - cron: '0 8 * * 3'  # Wednesday ~midnight Pacific (00:00 PST / 01:00 PDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run generate

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain SpellData.lua)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-spell-data"
          git checkout -B "$BRANCH"
          git add SpellData.lua
          git commit -m "chore: update SpellData.lua from SimC $(date -u +%Y-%m-%d)"
          git push -f origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "chore: update spell data" \
              --body "Auto-generated from SimulationCraft DBC data. See the diff for details." \
              --head "$BRANCH" \
              --base main
          fi
